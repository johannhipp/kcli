version: 2

project_name: kcli
before:
  hooks:
    - go mod verify
builds:
  - id: kcli
    main: ./cmd/kcli
    binary: kcli
    flags: [-trimpath]
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/johannhipp/kcli/internal/buildinfo.Version={{.Version}}
      - -X github.com/johannhipp/kcli/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/johannhipp/kcli/internal/buildinfo.Date={{.Date}}
archives:
  - formats: [tar.gz]
    files:
      - README.md
      - CHANGELOG.md
checksum:
  name_template: checksums.txt
changelog:
  disable: true

release:
  replace_existing_artifacts: true
