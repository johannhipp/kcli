version: 2

project_name: kcli
before:
  hooks:
    - go mod verify
builds:
  - id: kcli
    main: ./cmd/kcli
    binary: kcli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/johannhipp/kcli/internal/buildinfo.Version={{.Version}}
      - -X github.com/johannhipp/kcli/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/johannhipp/kcli/internal/buildinfo.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  disable: true
